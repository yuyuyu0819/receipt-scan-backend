openapi: 3.0.3
info:
  title: Receipt Scan Backend API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /api/ocr:
    post:
      summary: OCR a receipt image and return formatted data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - imageBase64
              properties:
                imageBase64:
                  type: string
      responses:
        "200":
          description: OCR result
          content:
            application/json:
              schema:
                type: object
                required:
                  - text
                properties:
                  text:
                    type: string
                  formatted:
                    $ref: "#/components/schemas/FormattedReceipt"
        "400":
          description: Invalid request
        "402":
          description: OpenAI quota exceeded
        "413":
          description: OpenAI context length exceeded
  /api/login:
    post:
      summary: Log in with userName and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userName
                - password
              properties:
                userName:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - userId
                  - token
                properties:
                  message:
                    type: string
                  userId:
                    type: integer
                    format: int64
                  token:
                    type: string
        "400":
          description: Validation error
        "401":
          description: Invalid credentials
  /api/user/register:
    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userName
                - password
                - email
                - recaptchaToken
              properties:
                userName:
                  type: string
                password:
                  type: string
                email:
                  type: string
                  format: email
                recaptchaToken:
                  type: string
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - userId
                properties:
                  message:
                    type: string
                  userId:
                    type: integer
                    format: int64
        "400":
          description: Validation error
  /api/receipts:
    post:
      summary: Save a formatted receipt
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer {token}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormattedReceipt"
      responses:
        "200":
          description: Receipt saved
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
        "400":
          description: Validation error
  /api/receipts/items:
    post:
      summary: Fetch receipt items by receiptId
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer {token}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - receiptId
              properties:
                receiptId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Items list
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
        "400":
          description: Validation error
  /api/receipts/by-user:
    post:
      summary: Fetch receipts by userId
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer {token}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Receipts list
          content:
            application/json:
              schema:
                type: object
                required:
                  - receipts
                properties:
                  receipts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Receipt"
        "400":
          description: Validation error
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
components:
  schemas:
    ReceiptItem:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
        price:
          type: integer
    FormattedReceipt:
      type: object
      required:
        - store
        - date
        - total
        - items
      properties:
        userId:
          type: integer
          format: int64
        store:
          type: string
        date:
          type: string
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptItem"
    Item:
      type: object
      required:
        - id
        - receiptId
        - name
        - price
      properties:
        id:
          type: integer
          format: int64
        receiptId:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: integer
    Receipt:
      type: object
      required:
        - id
        - userId
        - store
        - date
        - total
        - items
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        store:
          type: string
        date:
          type: string
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptItem"
