openapi: 3.0.3
info:
  title: Receipt Scan Backend API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /api/ocr:
    post:
      summary: OCR a receipt image and return formatted data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - imageBase64
              properties:
                imageBase64:
                  type: string
      responses:
        "200":
          description: OCR result
          content:
            application/json:
              schema:
                type: object
                required:
                  - text
                properties:
                  text:
                    type: string
                  formatted:
                    $ref: "#/components/schemas/FormattedReceipt"
        "400":
          description: Invalid request
        "402":
          description: OpenAI quota exceeded
        "413":
          description: OpenAI context length exceeded
  /api/login:
    post:
      summary: Log in with userId and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - password
              properties:
                userId:
                  type: integer
                  format: int64
                password:
                  type: string
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
        "400":
          description: Validation error
        "401":
          description: Invalid credentials
  /api/users:
    post:
      summary: Create a new user and send confirmation email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - password
                - email
              properties:
                userId:
                  type: integer
                  format: int64
                password:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
        "400":
          description: Validation error
  /activate:
    get:
      summary: Activation completion page
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: HTML activation page
          content:
            text/html:
              schema:
                type: string
  /api/receipts:
    post:
      summary: Save a formatted receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormattedReceipt"
      responses:
        "200":
          description: Receipt saved
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
        "400":
          description: Validation error
  /api/receipts/items:
    post:
      summary: Fetch receipt items by receiptId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - receiptId
              properties:
                receiptId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Items list
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
        "400":
          description: Validation error
  /api/receipts/by-user:
    post:
      summary: Fetch receipts by userId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Receipts list
          content:
            application/json:
              schema:
                type: object
                required:
                  - receipts
                properties:
                  receipts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Receipt"
        "400":
          description: Validation error
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
components:
  schemas:
    ReceiptItem:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
        price:
          type: integer
    FormattedReceipt:
      type: object
      required:
        - userId
        - store
        - date
        - total
        - items
      properties:
        userId:
          type: integer
          format: int64
        store:
          type: string
        date:
          type: string
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptItem"
    Item:
      type: object
      required:
        - id
        - receiptId
        - name
        - price
      properties:
        id:
          type: integer
          format: int64
        receiptId:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: integer
    Receipt:
      type: object
      required:
        - id
        - userId
        - store
        - date
        - total
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        store:
          type: string
        date:
          type: string
        total:
          type: integer
